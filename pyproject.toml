[project]
name = "workcal"
version = "2.0.0"
description = "Company holiday policies as config: workday counts, WORKDAY()-style date math, and a dim_date table."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.41",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "tomli-w>=1.0"]
parquet = ["pyarrow>=14"]

[project.scripts]
workcal = "workcal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workcal"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
filterwarnings = ["ignore:invalid escape sequence:DeprecationWarning", "ignore:invalid escape sequence:SyntaxWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
